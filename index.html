<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Blossoming Flowers - THANK YOU WINNIE</title>
  <style>
    *,
    *::after,
    *::before {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }

    :root {
      --dark-color: #000;
      --glow-color: #64ffda;
      --petal-light: #e8fffb;
      --petal-mid: #5ef2d6;
      --petal-deep: #0b6e6d;
      --leaf-bright: #39d98a;
      --leaf-dark: #073b3a;
    }

    body.not-loaded * {
      animation-play-state: paused !important;
    }

    body {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--dark-color);
      overflow: hidden;
      perspective: 1200px;
      font-family: "Cinzel", "Georgia", serif;
    }

    /* Night Backdrop */
    .night {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 50% 28%, rgba(18, 68, 74, 0.45) 0%, transparent 55%),
        radial-gradient(circle at 50% 85%, rgba(10, 48, 46, 0.5) 0%, var(--dark-color) 75%);
      z-index: 0;
    }

    /* Glowing Message Reveal ("THANK YOU WINNIE") */
    .name-reveal {
      position: fixed;
      top: 14%;
      left: 50%;
      max-width: 92vw;
      transform: translate(-50%, 18px) scale(0.92);
      z-index: 6;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: baseline;
      gap: clamp(0.2rem, 1vw, 0.65rem);
      pointer-events: none;
      opacity: 0;
      animation: reveal-name 2.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      animation-delay: 4.6s;
    }

    .name-reveal span {
      font-size: clamp(1.05rem, 3.2vw, 2.4rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #f4fffd;
      text-shadow:
        0 0 12px rgba(100, 255, 218, 0.9),
        0 0 28px rgba(100, 255, 218, 0.65),
        0 0 55px rgba(57, 217, 138, 0.45);
      animation: letter-float 3.6s ease-in-out infinite;
    }

    .name-reveal span.space {
      width: clamp(0.35rem, 1.5vw, 1rem);
      text-shadow: none;
    }

    .name-reveal span:nth-child(1)  { animation-delay: 0.0s; }
    .name-reveal span:nth-child(2)  { animation-delay: 0.12s; }
    .name-reveal span:nth-child(3)  { animation-delay: 0.24s; }
    .name-reveal span:nth-child(4)  { animation-delay: 0.36s; }
    .name-reveal span:nth-child(5)  { animation-delay: 0.48s; }
    .name-reveal span:nth-child(6)  { animation-delay: 0.54s; }
    .name-reveal span:nth-child(7)  { animation-delay: 0.60s; }
    .name-reveal span:nth-child(8)  { animation-delay: 0.72s; }
    .name-reveal span:nth-child(9)  { animation-delay: 0.84s; }
    .name-reveal span:nth-child(10) { animation-delay: 0.90s; }
    .name-reveal span:nth-child(11) { animation-delay: 0.96s; }
    .name-reveal span:nth-child(12) { animation-delay: 1.08s; }
    .name-reveal span:nth-child(13) { animation-delay: 1.20s; }
    .name-reveal span:nth-child(14) { animation-delay: 1.32s; }
    .name-reveal span:nth-child(15) { animation-delay: 1.44s; }
    .name-reveal span:nth-child(16) { animation-delay: 1.56s; }

    /* Rising Floating Leaves & Fireflies */
    .floating-field {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
    }

    .rising-leaf {
      position: absolute;
      bottom: 8%;
      width: 22px;
      height: 11px;
      border-radius: 100% 0 100% 0;
      background: linear-gradient(135deg, #a8ff78 0%, #39d98a 55%, #0d7377 100%);
      box-shadow: 0 0 14px rgba(100, 255, 218, 0.65);
      opacity: 0;
      animation: rise-and-dissolve 4.8s cubic-bezier(0.25, 0.8, 0.35, 1) forwards;
    }

    .rising-leaf::after {
      content: "";
      position: absolute;
      inset: 4px 3px;
      height: 1px;
      background: rgba(255, 255, 255, 0.55);
      transform: rotate(-18deg);
    }

    .rising-leaf--1 { left: 26%; animation-delay: 1.8s; --drift-x: 45px; --spin: 190deg; }
    .rising-leaf--2 { left: 34%; animation-delay: 2.1s; --drift-x: 35px; --spin: -210deg; }
    .rising-leaf--3 { left: 42%; animation-delay: 2.0s; --drift-x: 15px; --spin: 160deg; }
    .rising-leaf--4 { left: 50%; animation-delay: 2.3s; --drift-x: 0px; --spin: -180deg; }
    .rising-leaf--5 { left: 58%; animation-delay: 2.1s; --drift-x: -18px; --spin: 220deg; }
    .rising-leaf--6 { left: 66%; animation-delay: 2.4s; --drift-x: -40px; --spin: -175deg; }
    .rising-leaf--7 { left: 74%; animation-delay: 2.2s; --drift-x: -55px; --spin: 205deg; }
    .rising-leaf--8 { left: 46%; animation-delay: 2.6s; --drift-x: 10px; --spin: -240deg; }

    /* Ambient Glowing Particles */
    .flower__light {
      position: fixed;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #7ef9ff;
      box-shadow: 0 0 12px #7ef9ff;
      opacity: 0;
      z-index: 4;
      animation: float-light 6.5s ease-in-out infinite;
    }

    .flower__light--1 { left: 20%; top: 55%; animation-delay: 0.4s; }
    .flower__light--2 { left: 32%; top: 42%; background: #ffe66d; box-shadow: 0 0 12px #ffe66d; animation-delay: 1.2s; }
    .flower__light--3 { left: 50%; top: 36%; animation-delay: 2.0s; }
    .flower__light--4 { left: 68%; top: 44%; background: #a8ff78; box-shadow: 0 0 12px #a8ff78; animation-delay: 0.8s; }
    .flower__light--5 { left: 78%; top: 58%; animation-delay: 1.7s; }
    .flower__light--6 { left: 41%; top: 62%; background: #ffe66d; box-shadow: 0 0 12px #ffe66d; animation-delay: 2.5s; }

    /* Main Flower Stage */
    .flowers {
      position: relative;
      z-index: 2;
      width: 480px;
      height: 500px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      transform-style: preserve-3d;
    }

    .flower {
      position: absolute;
      bottom: 24px;
      transform-origin: bottom center;
      transform-style: preserve-3d;
      animation: sway 4.5s ease-in-out infinite;
    }

    .flower--1 {
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
    }

    .flower--2 {
      left: 22%;
      transform: scale(0.8) rotate(-14deg);
      animation-delay: -1.3s;
      z-index: 2;
    }

    .flower--3 {
      right: 20%;
      transform: scale(0.84) rotate(15deg);
      animation-delay: -2.2s;
      z-index: 2;
    }

    /* Stems */
    .flower__line {
      position: relative;
      width: 7px;
      height: 245px;
      margin: 0 auto;
      border-radius: 999px;
      background: linear-gradient(to top, #052e2d, #19a99d, #64ffda);
      box-shadow: 0 0 12px rgba(38, 208, 206, 0.35);
      transform-origin: bottom center;
      transform: scaleY(0);
      animation: grow-stem 1.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      animation-delay: 0.3s;
    }

    .flower--2 .flower__line { height: 195px; animation-delay: 0.6s; }
    .flower--3 .flower__line { height: 210px; animation-delay: 0.8s; }

    /* Curved 3D Flower Head */
    .flower__head {
      position: absolute;
      top: -36px;
      left: 50%;
      width: 120px;
      height: 84px;
      transform-style: preserve-3d;
      transform: translateX(-50%) rotateX(22deg) scale(0);
      transform-origin: bottom center;
      animation: bloom-3d 1.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      animation-delay: 1.4s;
    }

    .flower--2 .flower__head { animation-delay: 1.7s; }
    .flower--3 .flower__head { animation-delay: 1.9s; }

    .petal {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform-origin: bottom center;
      transform-style: preserve-3d;
      box-shadow:
        inset 0 -10px 18px rgba(7, 59, 58, 0.65),
        inset 0 6px 14px rgba(255, 255, 255, 0.85),
        0 0 22px rgba(100, 255, 218, 0.55);
    }

    /* Back Outer Curved Petals */
    .petal--back-1,
    .petal--back-2,
    .petal--back-3 {
      width: 36px;
      height: 66px;
      margin-left: -18px;
      border-radius: 58% 58% 28% 28% / 72% 72% 28% 28%;
      background: radial-gradient(
        ellipse at 50% 18%,
        var(--petal-light) 8%,
        var(--petal-mid) 52%,
        var(--petal-deep) 100%
      );
    }

    .petal--back-1 {
      transform: translateZ(-12px) rotateX(-16deg) rotateZ(0deg);
    }

    .petal--back-2 {
      transform: translateZ(-8px) rotateX(-12deg) rotateZ(-42deg) rotateY(-18deg);
    }

    .petal--back-3 {
      transform: translateZ(-8px) rotateX(-12deg) rotateZ(42deg) rotateY(18deg);
    }

    /* Side Cupped Petals */
    .petal--side-left,
    .petal--side-right {
      width: 34px;
      height: 58px;
      margin-left: -17px;
      border-radius: 65% 45% 35% 35% / 75% 65% 30% 30%;
      background: radial-gradient(
        ellipse at 45% 22%,
        #ffffff 12%,
        #8ef9e6 55%,
        #0f8280 100%
      );
    }

    .petal--side-left {
      transform: translateZ(6px) rotateX(18deg) rotateZ(-62deg) rotateY(-28deg);
    }

    .petal--side-right {
      border-radius: 45% 65% 35% 35% / 65% 75% 30% 30%;
      transform: translateZ(6px) rotateX(18deg) rotateZ(62deg) rotateY(28deg);
    }

    /* Front Cupped Lip Petal */
    .petal--front {
      width: 44px;
      height: 44px;
      margin-left: -22px;
      bottom: 6px;
      border-radius: 50% 50% 42% 42% / 62% 62% 38% 38%;
      background: radial-gradient(
        circle at 50% 30%,
        #ffffff 15%,
        #a3fff0 58%,
        #139491 100%
      );
      transform: translateZ(18px) rotateX(48deg);
    }

    /* Glowing Stamen Core */
    .flower__center {
      position: absolute;
      bottom: 12px;
      left: 50%;
      width: 18px;
      height: 14px;
      margin-left: -9px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff8d6 20%, #ffd166 75%, #f4a261 100%);
      box-shadow: 0 0 18px #ffd166, 0 0 30px #fff3b0;
      transform: translateZ(12px) rotateX(25deg);
    }

    /* Stem Leaves */
    .flower__line__leaf {
      position: absolute;
      width: 42px;
      height: 18px;
      border-radius: 100% 0 100% 0;
      background: linear-gradient(135deg, #64ffda, #0d7377);
      box-shadow: inset 0 2px 6px rgba(255, 255, 255, 0.35);
      opacity: 0;
      animation: leaf-pop 0.9s ease forwards;
      animation-delay: 1.0s;
    }

    .flower__line__leaf--left {
      left: -38px;
      top: 40%;
      transform-origin: right center;
    }

    .flower__line__leaf--right {
      right: -38px;
      top: 56%;
      transform: scaleX(-1);
      transform-origin: left center;
      animation-delay: 1.2s;
    }

    /* Foreground Layered Leaves & Grass Cluster */
    .flower__g-front {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 420px;
      height: 180px;
      z-index: 4;
      pointer-events: none;
    }

    .flower__g-front__stem {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 5px;
      height: 125px;
      margin-left: -2.5px;
      border-radius: 999px;
      background: linear-gradient(to top, #042423, #178f85);
      transform-origin: bottom center;
      transform: scaleY(0);
      animation: grow-stem 1.2s ease forwards;
      animation-delay: 0.7s;
    }

    .flower__g-front__leaf-wrapper {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform-origin: bottom center;
      opacity: 0;
      animation: front-leaf-grow 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .flower__g-front__leaf {
      width: 68px;
      height: 30px;
      border-radius: 100% 0 100% 0;
      background: linear-gradient(135deg, var(--leaf-bright) 0%, #159a8c 55%, var(--leaf-dark) 100%);
      box-shadow:
        inset 0 2px 8px rgba(255, 255, 255, 0.25),
        0 4px 14px rgba(0, 0, 0, 0.7);
    }

    /* Left & Right Foreground Leaf Pairs */
    .leaf-wrap--1 {
      bottom: 86px;
      margin-left: -68px;
      transform: rotate(-18deg);
      animation-delay: 1.1s;
    }

    .leaf-wrap--2 {
      bottom: 86px;
      margin-left: 2px;
      transform: scaleX(-1) rotate(-18deg);
      animation-delay: 1.2s;
    }

    .leaf-wrap--3 {
      bottom: 54px;
      margin-left: -82px;
      transform: rotate(-32deg) scale(1.15);
      animation-delay: 1.35s;
    }

    .leaf-wrap--4 {
      bottom: 54px;
      margin-left: 14px;
      transform: scaleX(-1) rotate(-32deg) scale(1.15);
      animation-delay: 1.45s;
    }

    .leaf-wrap--5 {
      bottom: 22px;
      margin-left: -96px;
      transform: rotate(-44deg) scale(1.25);
      animation-delay: 1.55s;
    }

    .leaf-wrap--6 {
      bottom: 22px;
      margin-left: 28px;
      transform: scaleX(-1) rotate(-44deg) scale(1.25);
      animation-delay: 1.65s;
    }

    /* Curved Grass Blades Framing the Foreground */
    .grass-blade {
      position: absolute;
      bottom: -6px;
      width: 18px;
      height: 150px;
      border-radius: 100% 100% 0 0;
      background: linear-gradient(to top, #031d1c, #188c82, #5ef2d6);
      transform-origin: bottom center;
      opacity: 0;
      animation: blade-sway 4s ease-in-out infinite, blade-rise 1.3s ease forwards;
    }

    .grass-blade--1 { left: 16%; height: 135px; --base-rot: -22deg; animation-delay: 0.9s; }
    .grass-blade--2 { left: 26%; height: 165px; --base-rot: -11deg; animation-delay: 1.1s; }
    .grass-blade--3 { right: 26%; height: 160px; --base-rot: 12deg; animation-delay: 1.0s; }
    .grass-blade--4 { right: 16%; height: 130px; --base-rot: 24deg; animation-delay: 1.2s; }

    /* Replay Button */
    .replay-btn {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 10;
      padding: 10px 18px;
      border-radius: 999px;
      border: 1px solid rgba(100, 255, 218, 0.45);
      background: rgba(7, 28, 30, 0.72);
      color: #e8fffb;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      cursor: pointer;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 16px rgba(100, 255, 218, 0.2);
      transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
    }

    .replay-btn:hover {
      background: rgba(16, 66, 68, 0.9);
      box-shadow: 0 0 22px rgba(100, 255, 218, 0.45);
      transform: translateY(-2px);
    }

    .replay-btn:active {
      transform: translateY(0) scale(0.97);
    }

    /* Keyframes */
    @keyframes grow-stem {
      to { transform: scaleY(1); }
    }

    @keyframes bloom-3d {
      0% {
        transform: translateX(-50%) rotateX(55deg) scale(0);
      }
      100% {
        transform: translateX(-50%) rotateX(22deg) scale(1);
      }
    }

    @keyframes leaf-pop {
      from { opacity: 0; transform: scale(0.2); }
      to { opacity: 1; }
    }

    @keyframes front-leaf-grow {
      from { opacity: 0; filter: brightness(0.4); }
      to { opacity: 1; filter: brightness(1); }
    }

    @keyframes blade-rise {
      from { opacity: 0; transform: rotate(var(--base-rot)) scaleY(0.1); }
      to { opacity: 0.92; transform: rotate(var(--base-rot)) scaleY(1); }
    }

    @keyframes blade-sway {
      0%, 100% { transform: rotate(var(--base-rot)); }
      50% { transform: rotate(calc(var(--base-rot) + 4deg)); }
    }

    @keyframes sway {
      0%, 100% { filter: drop-shadow(0 0 8px rgba(100, 255, 218, 0.25)); }
      50% { filter: drop-shadow(0 0 18px rgba(100, 255, 218, 0.5)); }
    }

    /* Leaves Rising into the Sky & Fading Out as Message Appears */
    @keyframes rise-and-dissolve {
      0% {
        opacity: 0;
        transform: translate(0, 0) rotate(0deg) scale(0.4);
      }
      18% {
        opacity: 0.95;
      }
      72% {
        opacity: 0.85;
        transform: translate(var(--drift-x), -54vh) rotate(var(--spin)) scale(1.05);
      }
      100% {
        opacity: 0;
        transform: translate(calc(var(--drift-x) * 1.25), -68vh) rotate(calc(var(--spin) * 1.3)) scale(0.2);
      }
    }

    @keyframes reveal-name {
      0% {
        opacity: 0;
        filter: blur(12px);
        transform: translate(-50%, 24px) scale(0.88);
      }
      100% {
        opacity: 1;
        filter: blur(0);
        transform: translate(-50%, 0) scale(1);
      }
    }

    @keyframes letter-float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }

    @keyframes float-light {
      0% { transform: translateY(15px) scale(0.6); opacity: 0; }
      35% { opacity: 0.9; }
      75% { opacity: 0.65; }
      100% { transform: translateY(-45px) scale(1.1); opacity: 0; }
    }
  </style>
</head>
<body class="not-loaded">
  <div class="night"></div>

  <!-- Message Reveal -->
  <div class="name-reveal" aria-label="THANK YOU WINNIE">
    <span>T</span>
    <span>H</span>
    <span>A</span>
    <span>N</span>
    <span>K</span>
    <span class="space" aria-hidden="true"></span>
    <span>Y</span>
    <span>O</span>
    <span>U</span>
    <span class="space" aria-hidden="true"></span>
    <span>W</span>
    <span>I</span>
    <span>N</span>
    <span>N</span>
    <span>I</span>
    <span>E</span>
  </div>

  <!-- Rising Leaves that Give Way to THANK YOU WINNIE -->
  <div class="floating-field">
    <div class="rising-leaf rising-leaf--1"></div>
    <div class="rising-leaf rising-leaf--2"></div>
    <div class="rising-leaf rising-leaf--3"></div>
    <div class="rising-leaf rising-leaf--4"></div>
    <div class="rising-leaf rising-leaf--5"></div>
    <div class="rising-leaf rising-leaf--6"></div>
    <div class="rising-leaf rising-leaf--7"></div>
    <div class="rising-leaf rising-leaf--8"></div>
  </div>

  <!-- Ambient Fireflies -->
  <div class="flower__light flower__light--1"></div>
  <div class="flower__light flower__light--2"></div>
  <div class="flower__light flower__light--3"></div>
  <div class="flower__light flower__light--4"></div>
  <div class="flower__light flower__light--5"></div>
  <div class="flower__light flower__light--6"></div>

  <div class="flowers">
    <!-- Center Flower -->
    <div class="flower flower--1">
      <div class="flower__head">
        <div class="petal petal--back-1"></div>
        <div class="petal petal--back-2"></div>
        <div class="petal petal--back-3"></div>
        <div class="petal petal--side-left"></div>
        <div class="petal petal--side-right"></div>

        <div class="flower__line__leaf flower__line__leaf--right"></div>
      </div>
    </div>

    <!-- Left Flower -->
    <div class="flower flower--2">

        <div class="petal petal--back-1"></div>
        <div class="petal petal--back-2"></div>
        <div class="petal petal--back-3"></div>
        <div class="petal petal--side-left"></div>
        <div class="petal petal--side-right"></div>
        <div class="flower__center"></div>
        <div class="petal petal--front"></div>
      </div>
      <div class="flower__line">
        <div class="flower__line__leaf flower__line__leaf--left"></div>
        <div class="flower__line__leaf flower__line__leaf--right"></div>
      </div>
    </div>

    <!-- Right Flower -->
    <div class="flower flower--3">
      <div class="flower__head">
        <div class="petal petal--back-1"></div>
        <div class="petal petal--back-2"></div>
        <div class="petal petal--back-3"></div>
        <div class="petal petal--side-left"></div>
        <div class="petal petal--side-right"></div>
        <div class="flower__center"></div>
        <div class="petal petal--front"></div>
      </div>
      <div class="flower__line">
        <div class="flower__line__leaf flower__line__leaf--left"></div>
        <div class="flower__line__leaf flower__line__leaf--right"></div>
      </div>
    </div>

    <!-- Foreground Layered Leaves & Grass -->
    <div class="flower__g-front">
      <div class="grass-blade grass-blade--1"></div>
      <div class="grass-blade grass-blade--2"></div>
      <div class="grass-blade grass-blade--3"></div>
      <div class="grass-blade grass-blade--4"></div>

      <div class="flower__g-front__stem"></div>

      <div class="flower__g-front__leaf-wrapper leaf-wrap--1">
        <div class="flower__g-front__leaf"></div>
      </div>
      <div class="flower__g-front__leaf-wrapper leaf-wrap--2">
        <div class="flower__g-front__leaf"></div>
      </div>
      <div class="flower__g-front__leaf-wrapper leaf-wrap--3">
        <div class="flower__g-front__leaf"></div>
      </div>
      <div class="flower__g-front__leaf-wrapper leaf-wrap--4">
        <div class="flower__g-front__leaf"></div>
      </div>
      <div class="flower__g-front__leaf-wrapper leaf-wrap--5">
        <div class="flower__g-front__leaf"></div>
      </div>
      <div class="flower__g-front__leaf-wrapper leaf-wrap--6">
        <div class="flower__g-front__leaf"></div>
      </div>
    </div>
  </div>

  <button type="button" class="replay-btn" id="replayBtn" aria-label="Replay animation">
    ↻ Replay
  </button>

  <script>
    let loadTimer = null;

    function startAnimation(delayMs = 900) {
      clearTimeout(loadTimer);
      document.body.classList.add("not-loaded");

      // Restart CSS animations cleanly on every animated element
      document.querySelectorAll("*").forEach((el) => {
        const animName = getComputedStyle(el).animationName;
        if (animName && animName !== "none") {
          el.style.animation = "none";
          void el.offsetWidth; // trigger reflow
          el.style.animation = "";
        }
      });

      loadTimer = setTimeout(() => {
        document.body.classList.remove("not-loaded");
      }, delayMs);
    }

    window.onload = () => {
      startAnimation(900);
    };

    document.getElementById("replayBtn").addEventListener("click", () => {
      startAnimation(120);
    });
  </script>
</body>
</html>
